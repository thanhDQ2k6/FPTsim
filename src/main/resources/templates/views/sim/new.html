<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhập SIM</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        .row {
            margin-bottom: 8px;
        }

        label {
            display: inline-block;
            width: 120px;
        }

        input, select {
            padding: 4px 6px;
        }

        .ok {
            color: green;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<h1>Nhập SIM</h1>

<form th:action="@{/sim/new}" method="post">
    <div class="row"><label>ICCID<input type="text" name="iccid" required></label></div>
    <div class="row"><label>MSISDN<input type="text" name="msisdn"></label></div>
    <div class="row">
        <label>Nhà mạng
            <select name="nhaMang" required>
                <option value="Viettel">Viettel</option>
                <option value="Mobiphone">Mobiphone</option>
                <option value="Vinaphone">Vinaphone</option>
            </select>
        </label>
    </div>
    <div class="row">
        <label>Loại SIM
            <select name="loaiSim" required>
                <option value="NgoaiDia">Ngoại Địa</option>
                <option value="TraTruoc">Trả Trước</option>
                <option value="TraSau">Trả Sau</option>
            </select>
        </label>
    </div>
    <div class="row"><label>Giá bán<input type="number" step="0.01" name="giaBan" required></label></div>
    <div class="row"><label>Giá nhập<input type="number" step="0.01" name="giaNhap" required></label></div>
    <div class="row"><label>Nhà cung cấp<input type="text" name="nhaCungCap" required></label></div>
    <div class="row"><label>Ghi chú<input type="text" name="ghiChu"></label></div>
    <div class="row">
        <button type="submit">Nhập SIM</button>
    </div>

    <div class="ok" th:if="${success}" th:text="${success}"></div>
</form>

<hr/>

<h2>Deactivate (soft delete)</h2>
<form th:action="@{/sim/__iccid__/deactivate(iccid=${'REPLACE_ICCID'})}" method="post">
    <div class="row"><label>ICCID<input type="text" name="iccid" value="" placeholder="Nhập ICCID..."></label></div>
    <div class="row"><em>Gọi POST /sim/{iccid}/deactivate bằng công cụ khác (HTTP client) để test JSON.</em></div>
</form>

</body>
</html>

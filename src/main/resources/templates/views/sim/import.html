<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhập lô SIM</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 24px
        }

        .row {
            margin-bottom: 8px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 12px
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px
        }

        .ok {
            color: green;
            margin-top: 8px
        }

        .btn {
            padding: 6px 10px;
            margin-right: 6px
        }
    </style>
</head>
<body>
<h1>Nhập lô SIM</h1>

<div class="ok" th:if="${success}" th:text="${success}"></div>

<form th:action="@{/sim/import}" th:object="${batch}" method="post" id="importForm">
    <div class="row">
        <label>Nhà cung cấp</label>
        <input th:field="*{nhaCungCap}" required>
    </div>
    <div class="row">
        <label>Ghi chú</label>
        <input th:field="*{ghiChu}">
    </div>

    <table id="simTable">
        <thead>
        <tr>
            <th>#</th>
            <th>ICCID</th>
            <th>MSISDN</th>
            <th>Nhà mạng</th>
            <th>Loại SIM</th>
            <th>Giá bán</th>
            <th>Giá nhập</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s,iter : *{sims}">
            <td th:text="${iter.index + 1}">1</td>
            <td><input th:field="*{sims[__${iter.index}__].iccid}" required></td>
            <td><input th:field="*{sims[__${iter.index}__].msisdn}"></td>
            <td>
                <select th:field="*{sims[__${iter.index}__].nhaMang}" required>
                    <option value="Viettel">Viettel</option>
                    <option value="Mobiphone">Mobiphone</option>
                    <option value="Vinaphone">Vinaphone</option>
                </select>
            </td>
            <td>
                <select th:field="*{sims[__${iter.index}__].loaiSim}" required>
                    <option value="NgoaiDia">Ngoại Địa</option>
                    <option value="TraTruoc">Trả Trước</option>
                    <option value="TraSau">Trả Sau</option>
                </select>
            </td>
            <td><input type="number" step="0.01" th:field="*{sims[__${iter.index}__].giaBan}" required></td>
            <td><input type="number" step="0.01" th:field="*{sims[__${iter.index}__].giaNhap}" required></td>
            <td>
                <button type="button" onclick="removeRow(this)">X</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="margin-top:8px">
        <button type="button" class="btn" onclick="addRow()">+ Thêm dòng</button>
        <button type="submit" class="btn">Nhập lô</button>
    </div>
</form>

<script>
    function addRow() {
        const tbody = document.querySelector('#simTable tbody');
        const idx = tbody.rows.length;
        const tr = document.createElement('tr');
        tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><input name="sims[${idx}].iccid" required></td>
      <td><input name="sims[${idx}].msisdn"></td>
      <td>
        <select name="sims[${idx}].nhaMang" required>
          <option value="Viettel">Viettel</option>
          <option value="Mobiphone">Mobiphone</option>
          <option value="Vinaphone">Vinaphone</option>
        </select>
      </td>
      <td>
        <select name="sims[${idx}].loaiSim" required>
          <option value="NgoaiDia">Ngoại Địa</option>
          <option value="TraTruoc">Trả Trước</option>
          <option value="TraSau">Trả Sau</option>
        </select>
      </td>
      <td><input type="number" step="0.01" name="sims[${idx}].giaBan" required></td>
      <td><input type="number" step="0.01" name="sims[${idx}].giaNhap" required></td>
      <td><button type="button" onclick="removeRow(this)">X</button></td>
    `;
        tbody.appendChild(tr);
    }

    function removeRow(btn) {
        const tr = btn.closest('tr');
        tr.remove();
        renumber();
    }

    function renumber() {
        const rows = document.querySelectorAll('#simTable tbody tr');
        rows.forEach((tr, i) => {
            tr.cells[0].textContent = i + 1;
            tr.querySelectorAll('input,select').forEach(el => {
                el.name = el.name.replace(/sims\[\d+\]/, `sims[${i}]`);
            });
        });
    }
</script>
</body>
</html>

<!doctype html>
<html th:replace="~{layouts/layout :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title>Order Details - FPTsim</title>
<main>
    <div class="container mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold">Order Details</h1>
            <a class="d-btn d-btn-ghost" th:href="@{/orders}">
                <i class="fa-solid fa-arrow-left mr-2"></i>
                Back to Orders
            </a>
        </div>

        <!-- Flash Messages -->
        <div class="d-alert d-alert-success mb-4" th:if="${success}">
            <i class="fa-solid fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div class="d-alert d-alert-error mb-4" th:if="${error}">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Order Information -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <!-- Order Header -->
                <div class="d-card bg-base-100 shadow-md">
                    <div class="d-card-body">
                        <div class="flex items-start justify-between">
                            <div>
                                <h2 class="text-2xl font-bold">Order #<span th:text="${order.maHD}">HD12345</span></h2>
                                <div class="flex gap-4 mt-2 text-sm">
                                    <span>
                                        <i class="fa-regular fa-calendar mr-1"></i>
                                        <span th:text="${#temporals.format(order.ngayTao, 'dd/MM/yyyy HH:mm')}">20/10/2025</span>
                                    </span>
                                    <span class="d-badge d-badge-lg" 
                                          th:classappend="${order.trangThaiDon.name() == 'DaHoanThanh'} ? 'd-badge-success' : 'd-badge-warning'"
                                          th:text="${order.trangThaiDon == T(com.model.HoaDon$TrangThaiDon).ChoXacNhan} ? 'Pending' : 'Completed'">
                                        Pending
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SIM Cards in Order -->
                <div class="d-card bg-base-100 shadow-md">
                    <div class="d-card-body">
                        <h3 class="d-card-title">SIM Cards</h3>
                        <div class="divider"></div>
                        <div class="space-y-3" th:each="detail : ${order.hoaDonChiTiets}">
                            <div class="flex items-center justify-between p-3 bg-base-200 rounded-lg">
                                <div>
                                    <div class="font-semibold">
                                        <i class="fa-solid fa-sim-card text-primary mr-2"></i>
                                        <span th:text="${detail.sim.msisdn}">0901234567</span>
                                    </div>
                                    <div class="text-sm mt-1 space-x-2">
                                        <span class="d-badge d-badge-sm d-badge-primary" th:text="${detail.sim.nhaMang}">Viettel</span>
                                        <span class="d-badge d-badge-sm d-badge-secondary" th:text="${detail.sim.loaiSim}">Prepaid</span>
                                        <span class="d-badge d-badge-sm" 
                                              th:classappend="${detail.sim.trangThai.name() == 'HoatDong'} ? 'd-badge-success' : 'd-badge-info'"
                                              th:text="${detail.sim.trangThai}">HoatDong</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold text-success" th:text="${#numbers.formatDecimal(detail.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                                        50,000 VND
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Rating Section (only for completed orders) -->
                <div class="d-card bg-base-100 shadow-md" th:if="${order.trangThaiDon.name() == 'DaHoanThanh'}">
                    <div class="d-card-body">
                        <h3 class="d-card-title">Rate Your Experience</h3>
                        <div class="divider"></div>
                        
                        <div th:if="${order.danhGia != null}">
                            <div class="d-alert d-alert-info">
                                <i class="fa-solid fa-check-circle"></i>
                                <span>You have already rated this order</span>
                            </div>
                            <div class="mt-4">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="font-semibold">Your Rating:</span>
                                    <div class="text-warning">
                                        <i class="fa-solid fa-star" th:each="i : ${#numbers.sequence(1, order.danhGia.sao)}"></i>
                                        <i class="fa-regular fa-star" th:each="i : ${#numbers.sequence(order.danhGia.sao + 1, 5)}"></i>
                                    </div>
                                </div>
                                <p class="text-sm" th:text="${order.danhGia.noiDung}">Great service!</p>
                            </div>
                        </div>
                        
                        <form method="post" th:action="@{/orders/{id}/rate(id=${order.maHD})}" th:if="${order.danhGia == null}">
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text">Stars (1-5) *</span>
                                </label>
                                <div class="d-rating d-rating-lg">
                                    <input class="d-rating-hidden" name="stars" type="radio" value="0" />
                                    <input class="d-mask d-mask-star-2 bg-warning" name="stars" type="radio" value="1" />
                                    <input class="d-mask d-mask-star-2 bg-warning" name="stars" type="radio" value="2" />
                                    <input class="d-mask d-mask-star-2 bg-warning" name="stars" type="radio" value="3" />
                                    <input class="d-mask d-mask-star-2 bg-warning" name="stars" type="radio" value="4" />
                                    <input checked class="d-mask d-mask-star-2 bg-warning" name="stars" type="radio" value="5" />
                                </div>
                            </div>
                            
                            <div class="d-form-control mt-4">
                                <label class="d-label">
                                    <span class="d-label-text">Comment (optional)</span>
                                </label>
                                <textarea class="d-textarea d-textarea-bordered" name="comment" placeholder="Share your experience..." rows="3"></textarea>
                            </div>
                            
                            <button class="d-btn d-btn-primary w-full mt-4" type="submit">
                                <i class="fa-solid fa-star mr-2"></i>
                                Submit Rating
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Order Summary Sidebar -->
            <div class="lg:col-span-1">
                <div class="d-card bg-base-100 shadow-md sticky top-4">
                    <div class="d-card-body">
                        <h3 class="d-card-title">Summary</h3>
                        <div class="divider"></div>
                        
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span>Status:</span>
                                <span class="font-semibold" th:text="${order.trangThaiDon == T(com.model.HoaDon$TrangThaiDon).ChoXacNhan} ? 'Pending' : 'Completed'">Pending</span>
                            </div>
                            <div class="flex justify-between">
                                <span>Items:</span>
                                <span class="font-semibold" th:text="${#lists.size(order.hoaDonChiTiets)}">2</span>
                            </div>
                            <div class="flex justify-between" th:if="${order.nhanVien != null}">
                                <span>Processed by:</span>
                                <span class="font-semibold" th:text="${order.nhanVien.hoTen}">Staff Name</span>
                            </div>
                        </div>
                        
                        <div class="divider"></div>
                        
                        <div class="flex justify-between items-center text-lg font-bold">
                            <span>Total:</span>
                            <span class="text-success" th:text="${#numbers.formatDecimal(order.tongTien, 0, 'COMMA', 0, 'POINT')} + ' VND'">150,000 VND</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</html>

<!doctype html>
<html th:replace="~{layouts/layout :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title>Customer Ratings - FPTsim</title>
<main>
    <div class="container mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold mb-6">Customer Reviews</h1>

        <!-- Ratings List -->
        <div class="space-y-4" th:if="${!ratings.empty}">
            <div class="d-card bg-base-100 shadow-md" th:each="rating : ${ratings.content}">
                <div class="d-card-body">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="d-avatar d-placeholder">
                                    <div class="bg-primary text-primary-content rounded-full w-12">
                                        <span class="text-xl" th:text="${#strings.substring(rating.hoaDon.khachHang.hoTen, 0, 1)}">J</span>
                                    </div>
                                </div>
                                <div>
                                    <div class="font-semibold" th:text="${rating.hoaDon.khachHang.hoTen}">Customer Name</div>
                                    <div class="text-xs text-base-content/70" th:text="${#temporals.format(rating.ngayDanhGia, 'dd/MM/yyyy HH:mm')}">
                                        20/10/2025 14:30
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-2 mb-3">
                                <div class="text-warning text-lg">
                                    <i class="fa-solid fa-star" th:each="i : ${#numbers.sequence(1, rating.sao)}"></i>
                                    <i class="fa-regular fa-star" th:each="i : ${#numbers.sequence(rating.sao + 1, 5)}"></i>
                                </div>
                                <span class="text-sm text-base-content/70" th:text="${rating.sao} + '/5 stars'">5/5 stars</span>
                            </div>
                            
                            <p class="text-base-content/90" th:if="${rating.noiDung != null && !rating.noiDung.isBlank()}" th:text="${rating.noiDung}">
                                Great service! Very satisfied with my purchase.
                            </p>
                            
                            <div class="mt-3 text-sm">
                                <span class="text-base-content/70">Order: </span>
                                <a class="d-link d-link-primary" th:href="@{/orders/{id}(id=${rating.hoaDon.maHD})}" th:text="${rating.hoaDon.maHD}">
                                    HD12345678
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-12" th:if="${ratings.empty}">
            <i class="fa-solid fa-star text-6xl text-base-300 mb-4"></i>
            <p class="text-xl text-base-content/70">No ratings yet</p>
        </div>

        <!-- Pagination -->
        <div class="d-join flex justify-center mt-8" th:if="${totalPages > 1}">
            <a class="d-join-item d-btn" 
               th:classappend="${currentPage == 0} ? 'd-btn-disabled' : ''"
               th:href="@{/ratings(page=${currentPage - 1}, size=10)}">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            
            <th:block th:with="startPage=${currentPage > 0 ? currentPage - 1 : 0}, 
                                endPage=${currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1}">
                <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                    <a class="d-join-item d-btn" 
                       th:classappend="${i == currentPage} ? 'd-btn-active' : ''"
                       th:href="@{/ratings(page=${i}, size=10)}"
                       th:text="${i + 1}">1</a>
                </th:block>
            </th:block>
            
            <a class="d-join-item d-btn"
               th:classappend="${currentPage >= totalPages - 1} ? 'd-btn-disabled' : ''"
               th:href="@{/ratings(page=${currentPage + 1}, size=10)}">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</main>
</html>

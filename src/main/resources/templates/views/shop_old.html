<!doctype html>
<html th:replace="~{layouts/layout :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title>Shop - FPTsim</title>
<main>
    <div class="container mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold">Browse SIM Cards</h1>
            <a class="d-btn d-btn-primary" th:href="@{/cart}">
                <i class="fa-solid fa-cart-shopping mr-2"></i>
                Cart (<span th:text="${cartCount}">0</span>)
            </a>
        </div>

        <!-- Filters and Sorting -->
        <div class="d-card bg-base-100 shadow-md mb-6">
            <div class="d-card-body">
                <form method="get" th:action="@{/shop}">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="d-form-control">
                            <label class="d-label">
                                <span class="d-label-text">Provider</span>
                            </label>
                            <select class="d-select d-select-bordered" name="nhaMang">
                                <option value="">All Providers</option>
                                <option th:value="'Viettel'" th:selected="${nhaMang == 'Viettel'}">Viettel</option>
                                <option th:value="'Mobiphone'" th:selected="${nhaMang == 'Mobiphone'}">Mobiphone</option>
                                <option th:value="'Vinaphone'" th:selected="${nhaMang == 'Vinaphone'}">Vinaphone</option>
                            </select>
                        </div>
                        <div class="d-form-control">
                            <label class="d-label">
                                <span class="d-label-text">Type</span>
                            </label>
                            <select class="d-select d-select-bordered" name="loaiSim">
                                <option value="">All Types</option>
                                <option th:value="'TraTruoc'" th:selected="${loaiSim == 'TraTruoc'}">Prepaid</option>
                                <option th:value="'TraSau'" th:selected="${loaiSim == 'TraSau'}">Postpaid</option>
                                <option th:value="'NgoaiDia'" th:selected="${loaiSim == 'NgoaiDia'}">International</option>
                            </select>
                        </div>
                        <div class="d-form-control">
                            <label class="d-label">
                                <span class="d-label-text">Sort By</span>
                            </label>
                            <select class="d-select d-select-bordered" name="sortBy">
                                <option value="">Latest</option>
                                <option th:value="'price'" th:selected="${sortBy == 'price'}">Price: Low to High</option>
                                <option th:value="'price-desc'" th:selected="${sortBy == 'price-desc'}">Price: High to Low</option>
                            </select>
                        </div>
                        <div class="d-form-control flex items-end">
                            <button class="d-btn d-btn-primary w-full" type="submit">
                                <i class="fa-solid fa-filter mr-2"></i>
                                Apply Filters
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Flash Messages -->
        <div class="d-alert d-alert-success mb-4" th:if="${success}">
            <i class="fa-solid fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div class="d-alert d-alert-error mb-4" th:if="${error}">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- SIM Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div class="d-card bg-base-100 shadow-md hover:shadow-lg transition-shadow" th:each="sim : ${sims.content}">
                <div class="d-card-body">
                    <h2 class="d-card-title text-lg">
                        <i class="fa-solid fa-sim-card text-primary"></i>
                        <span th:text="${sim.msisdn}">0901234567</span>
                    </h2>
                    
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="font-semibold">Provider:</span>
                            <span class="d-badge d-badge-primary" th:text="${sim.nhaMang}">Viettel</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-semibold">Type:</span>
                            <span class="d-badge d-badge-secondary" th:text="${sim.loaiSim}">Prepaid</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-semibold">Price:</span>
                            <span class="text-xl font-bold text-success" th:text="${#numbers.formatDecimal(sim.giaBan, 0, 'COMMA', 0, 'POINT')} + ' VND'">50,000 VND</span>
                        </div>
                    </div>
                    
                    <div class="d-card-actions justify-end mt-4">
                        <form method="post" th:action="@{/shop/add-to-cart}">
                            <input name="iccid" th:value="${sim.iccid}" type="hidden" />
                            <button class="d-btn d-btn-primary d-btn-sm" type="submit">
                                <i class="fa-solid fa-cart-plus mr-1"></i>
                                Add to Cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-12" th:if="${sims.empty}">
            <i class="fa-solid fa-box-open text-6xl text-base-300 mb-4"></i>
            <p class="text-xl text-base-content/70">No SIM cards available</p>
        </div>

        <!-- Pagination -->
        <div class="d-join flex justify-center mt-8" th:if="${totalPages > 1}">
            <a class="d-join-item d-btn" 
               th:classappend="${currentPage == 0} ? 'd-btn-disabled' : ''"
               th:href="@{/shop(page=${currentPage - 1}, size=10, nhaMang=${nhaMang}, loaiSim=${loaiSim}, sortBy=${sortBy})}">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            
            <th:block th:with="startPage=${currentPage > 0 ? currentPage - 1 : 0}, 
                                endPage=${currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1}">
                <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                    <a class="d-join-item d-btn" 
                       th:classappend="${i == currentPage} ? 'd-btn-active' : ''"
                       th:href="@{/shop(page=${i}, size=10, nhaMang=${nhaMang}, loaiSim=${loaiSim}, sortBy=${sortBy})}"
                       th:text="${i + 1}">1</a>
                </th:block>
            </th:block>
            
            <a class="d-join-item d-btn"
               th:classappend="${currentPage >= totalPages - 1} ? 'd-btn-disabled' : ''"
               th:href="@{/shop(page=${currentPage + 1}, size=10, nhaMang=${nhaMang}, loaiSim=${loaiSim}, sortBy=${sortBy})}">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>
</main>
</html>

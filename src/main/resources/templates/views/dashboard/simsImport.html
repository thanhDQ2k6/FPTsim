<!doctype html>
<html th:replace="~{layouts/dashboard :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
  <title th:text="#{nav.sims.import}"></title>
  <main>
    <div class="d-tabs d-tabs-lift min-h-full w-full">
      <input checked class="d-tab" name="my_tabs_3" th:attr="aria-label=#{nav.sims}" type="radio" />
      <div class="d-tab-content bg-base-100 border-base-300 p-6">
        <h1 class="mb-4 text-2xl font-bold" th:text="#{'sim.import.title'}"></h1>

        <form id="importForm" method="post" th:action="@{/dashboard/sims/import}" th:object="${batch}">
          <div class="grid grid-cols-3 gap-4">
            <div class="col-span-1">
              <label class="d-label" th:text="#{sim.import.provider}"></label>
              <input class="d-input d-input-bordered w-full" required th:field="*{nhaCungCap}" />
            </div>

            <div class="col-span-2">
              <label class="d-label" th:text="#{sim.import.note}"></label>
              <input class="d-input d-input-bordered w-full" th:field="*{ghiChu}" />
            </div>
          </div>

          <div class="mt-4 overflow-x-auto">
            <table
              class="d-table d-table-sm w-full"
              id="simTable"
              th:attr="data-type-international=#{sim.type.international},data-type-prepaid=#{sim.type.prepaid},data-type-postpaid=#{sim.type.postpaid},data-provider-viettel=#{sim.provider.viettel},data-provider-mobifone=#{sim.provider.mobifone},data-provider-vinaphone=#{sim.provider.vinaphone},data-remove=#{sim.import.remove}"
            >
              <thead>
                <tr>
                  <th class="w-3/12" th:text="#{'sim.import.header.iccid'}"></th>
                  <th class="w-2/12" th:text="#{'sim.import.header.msisdn'}"></th>
                  <th class="w-1/12" th:text="#{'sim.import.header.provider'}"></th>
                  <th class="w-1/12" th:text="#{'sim.import.header.type'}"></th>
                  <th class="w-2/12" th:text="#{'sim.import.header.priceSell'}"></th>
                  <th class="w-2/12" th:text="#{'sim.import.header.priceBuy'}"></th>
                  <th class="w-1/12"></th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="s,iter : *{sims}">
                  <td>
                    <input
                      class="d-input d-input-bordered w-full"
                      required
                      th:field="*{sims[__${iter.index}__].iccid}"
                    />
                  </td>
                  <td>
                    <input class="d-input d-input-bordered w-full" th:field="*{sims[__${iter.index}__].msisdn}" />
                  </td>
                  <td>
                    <select
                      class="d-select d-select-bordered w-full"
                      required
                      th:field="*{sims[__${iter.index}__].nhaMang}"
                    >
                      <option th:text="#{sim.provider.viettel}" value="Viettel"></option>
                      <option th:text="#{sim.provider.mobifone}" value="Mobifone"></option>
                      <option th:text="#{sim.provider.vinaphone}" value="Vinaphone"></option>
                    </select>
                  </td>
                  <td>
                    <select
                      class="d-select d-select-bordered w-full"
                      required
                      th:field="*{sims[__${iter.index}__].loaiSim}"
                    >
                      <option th:text="#{sim.type.international}" value="NgoaiDia"></option>
                      <option th:text="#{sim.type.prepaid}" value="TraTruoc"></option>
                      <option th:text="#{sim.type.postpaid}" value="TraSau"></option>
                    </select>
                  </td>
                  <td>
                    <input
                      class="d-input d-input-bordered w-full"
                      required
                      step="0.01"
                      th:field="*{sims[__${iter.index}__].giaBan}"
                      type="number"
                    />
                  </td>
                  <td>
                    <input
                      class="d-input d-input-bordered w-full"
                      required
                      step="0.01"
                      th:field="*{sims[__${iter.index}__].giaNhap}"
                      type="number"
                    />
                  </td>
                  <td>
                    <button
                      class="d-btn d-btn-sm d-btn-outline"
                      onclick="removeRow(this)"
                      th:text="#{sim.import.remove}"
                      type="button"
                    >
                      X
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-4 flex items-center gap-2">
            <button
              class="d-btn d-btn-primary"
              onclick="addRow()"
              th:text="#{sim.import.addRow}"
              type="button"
            ></button>
            <button class="d-btn d-btn-secondary" th:text="#{sim.import.submit}" type="submit"></button>
          </div>
        </form>

        <script>
          function addRow() {
            const tbody = document.querySelector('#simTable tbody')
            const idx = tbody.rows.length
            const table = document.getElementById('simTable')
            const labels = table.dataset
            const tr = document.createElement('tr')
            tr.innerHTML = `
              <td><input name="sims[${idx}].iccid" class="d-input d-input-bordered w-full" required></td>
              <td><input name="sims[${idx}].msisdn" class="d-input d-input-bordered w-full"></td>
              <td>
                <select name="sims[${idx}].nhaMang" class="d-select d-select-bordered w-full" required>
                  <option value="Viettel">${labels.providerViettel}</option>
                  <option value="Mobifone">${labels.providerMobifone}</option>
                  <option value="Vinaphone">${labels.providerVinaphone}</option>
                </select>
              </td>
              <td>
                <select name="sims[${idx}].loaiSim" class="d-select d-select-bordered w-full" required>
                  <option value="NgoaiDia">${labels.typeInternational}</option>
                  <option value="TraTruoc">${labels.typePrepaid}</option>
                  <option value="TraSau">${labels.typePostpaid}</option>
                </select>
              </td>
              <td>
              <input name="sims[${idx}].giaBan" type="number" step="0.01" class="d-input d-input-bordered w-full" required>
              </td>
              <td>
              <input name="sims[${idx}].giaNhap" type="number" step="0.01" class="d-input d-input-bordered w-full" required>
              </td>
              <td>
              <button type="button" class="d-btn d-btn-sm d-btn-outline" onclick="removeRow(this)">${labels.remove || 'X'}</button>
              </td>
            `
            tbody.appendChild(tr)
          }

          function removeRow(btn) {
            const tr = btn.closest('tr')
            tr.remove()
            renumber()
          }

          function renumber() {
            const rows = document.querySelectorAll('#simTable tbody tr')
            rows.forEach((tr, i) => {
              tr.querySelectorAll('input[name], select[name]').forEach((el) => {
                el.name = el.name.replace(/sims\[\d+\]/, `sims[${i}]`)
              })
            })
          }
        </script>
      </div>

      <input class="d-tab" name="my_tabs_3" th:attr="aria-label=#{import.history.title}" type="radio" />
      <div class="d-tab-content bg-base-100 border-base-300 p-6">
        <h2 class="mb-4 text-xl font-semibold" th:text="#{import.history.title}"></h2>

        <div class="mt-2 overflow-x-auto">
          <table class="d-table d-table-zebra w-full">
            <thead>
              <tr>
                <th>Staff</th>
                <th>Import Date</th>
                <th>Provider</th>
                <th>Quantity</th>
                <th>Total Cost</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="imp : ${importHeaders.content}">
                <td th:text="${imp.nhanVienHoTen}"></td>
                <td th:text="${#temporals.format(imp.ngayNhap, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${imp.nhaCungCap}"></td>
                <td th:text="${imp.soLuong}"></td>
                <td th:text="${#numbers.formatDecimal(imp.tongGiaNhap, 0, 0)} + ' VND'"></td>
              </tr>

              <tr th:if="${importHeaders.empty}">
                <td class="text-center" colspan="5">
                  <div class="d-alert d-alert-info">
                    <i class="fa-solid fa-info-circle"></i>
                    <span>No import history found</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Functional Pagination -->
        <div th:if="${!importHeaders.empty}" class="mt-6 flex items-center justify-center gap-4">
          <div class="flex gap-2">
            <a th:href="@{/dashboard/sims/import(hPage=0)}" 
               th:classappend="${importHeaders.first} ? 'd-btn-disabled' : ''"
               class="d-btn d-btn-sm d-btn-outline">
              <i class="fa-solid fa-angles-left"></i> First
            </a>
            <a th:href="@{/dashboard/sims/import(hPage=${importHeaders.number - 1})}" 
               th:classappend="${importHeaders.first} ? 'd-btn-disabled' : ''"
               class="d-btn d-btn-sm d-btn-outline">
              <i class="fa-solid fa-angle-left"></i> Prev
            </a>
          </div>

          <div class="hidden gap-2 sm:flex">
            <!-- Show max 3 page numbers centered on current page -->
            <th:block th:with="start=${importHeaders.number > 0 ? importHeaders.number - 1 : 0},
                              end=${start + 2 < importHeaders.totalPages ? start + 2 : importHeaders.totalPages - 1}">
              <a th:each="i : ${#numbers.sequence(start, end)}"
                 th:href="@{/dashboard/sims/import(hPage=${i})}"
                 th:text="${i + 1}"
                 th:classappend="${i == importHeaders.number} ? 'd-btn-active' : 'd-btn-ghost'"
                 class="d-btn d-btn-sm"></a>
            </th:block>
          </div>

          <div class="flex gap-2">
            <a th:href="@{/dashboard/sims/import(hPage=${importHeaders.number + 1})}" 
               th:classappend="${importHeaders.last} ? 'd-btn-disabled' : ''"
               class="d-btn d-btn-sm d-btn-outline">
              Next <i class="fa-solid fa-angle-right"></i>
            </a>
            <a th:href="@{/dashboard/sims/import(hPage=${importHeaders.totalPages - 1})}" 
               th:classappend="${importHeaders.last} ? 'd-btn-disabled' : ''"
               class="d-btn d-btn-sm d-btn-outline">
              Last <i class="fa-solid fa-angles-right"></i>
            </a>
          </div>
        </div>
        
        <div th:if="${!importHeaders.empty}" class="mt-4 text-center text-sm text-base-content/70">
          Page <span th:text="${importHeaders.number + 1}"></span> of <span th:text="${importHeaders.totalPages}"></span>
          (Total: <span th:text="${importHeaders.totalElements}"></span> records)
        </div>
      </div>
    </div>
  </main>
</html>

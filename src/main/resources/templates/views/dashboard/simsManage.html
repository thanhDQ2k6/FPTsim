<!doctype html>
<html th:replace="~{layouts/dashboard :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title th:text="#{nav.sims.manage}"></title>
<main>
    <div class="d-tabs d-tabs-lift min-h-full w-full">
        <input checked class="d-tab" name="my_tabs_3" th:attr="aria-label=#{nav.sims}" type="radio"/>
        <div class="d-tab-content bg-base-100 border-base-300 p-6">
            <div class="flex items-center justify-between gap-4">
                <form class="w-2/3" method="get" th:action="@{/dashboard/sims/manage}">
                    <fieldset class="d-fieldset">
                        <legend class="d-fieldset-legend text-lg font-bold" th:text="#{sortByOrder}"></legend>
                        <div class="flex items-center gap-3">
                            <div class="w-1/3">
                                <label class="d-label" for="filterProvider" th:text="#{sim.filter.provider}"></label>
                                <select
                                        class="d-select d-select-bordered w-full"
                                        id="filterProvider"
                                        name="nhaMang"
                                        th:attr="aria-label=#{sim.filter.provider}"
                                >
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:selected="${nhaMang == 'Viettel'}" value="Viettel">Viettel</option>
                                    <option th:selected="${nhaMang == 'Mobiphone'}" value="Mobiphone">Mobiphone</option>
                                    <option th:selected="${nhaMang == 'Vinaphone'}" value="Vinaphone">Vinaphone</option>
                                </select>
                            </div>

                            <div class="w-1/3">
                                <label class="d-label" for="filterType" th:text="#{sim.filter.type}"></label>
                                <select
                                        class="d-select d-select-bordered w-full"
                                        id="filterType"
                                        name="loaiSim"
                                        th:attr="aria-label=#{sim.filter.type}"
                                >
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:selected="${loaiSim == 'TraTruoc'}" value="TraTruoc">Prepaid (Trả Trước)</option>
                                    <option th:selected="${loaiSim == 'TraSau'}" value="TraSau">Postpaid (Trả Sau)</option>
                                    <option th:selected="${loaiSim == 'NgoaiDia'}" value="NgoaiDia">International (Ngoại Địa)</option>
                                </select>
                            </div>

                            <div class="w-1/3">
                                <label class="d-label" for="filterStatus" th:text="#{sim.filter.status}"></label>
                                <select
                                        class="d-select d-select-bordered w-full"
                                        id="filterStatus"
                                        name="trangThai"
                                        th:attr="aria-label=#{sim.filter.status}"
                                >
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:selected="${trangThai == 'SanSang'}" value="SanSang">Available (Sẵn Sàng)</option>
                                    <option th:selected="${trangThai == 'DaBan'}" value="DaBan">Sold (Đã Bán)</option>
                                    <option th:selected="${trangThai == 'HoatDong'}" value="HoatDong">Active (Hoạt Động)</option>
                                    <option th:selected="${trangThai == 'Chet'}" value="Chet">Inactive (Chết)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 flex gap-2 justify-end">
                            <button class="d-btn d-btn-primary" type="submit">
                                <i class="fa-solid fa-filter"></i>
                                Apply Filters
                            </button>
                            <a class="d-btn d-btn-ghost" th:href="@{/dashboard/sims/manage}" th:text="#{accounts.reset}">Reset</a>
                        </div>
                    </fieldset>
                </form>

                <div class="flex w-1/3 justify-end">
                    <!-- Placeholder for future actions -->
                </div>
            </div>

            <!-- Table -->
            <div class="mt-6 overflow-x-auto">
                <table class="d-table w-full">
                    <thead>
                    <tr>
                        <th class="text-left" th:text="#{accounts.table.no}"></th>
                        <th class="text-left">MSISDN</th>
                        <th class="text-left" th:text="#{sim.provider.label}"></th>
                        <th class="text-left" th:text="#{sim.type.label}"></th>
                        <th class="text-left" th:text="#{sim.status.label}"></th>
                        <th class="text-left" th:text="#{table.action}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sim, idx : ${sims}">
                        <td th:text="${idx.index + 1}"></td>
                        <td th:text="${sim.msisdn}">0987654321</td>
                        <td th:text="${sim.nhaMang}">Viettel</td>
                        <td th:text="${sim.loaiSim}">TraTruoc</td>
                        <td th:text="${sim.trangThai}">SanSang</td>
                        <td>
                            <div class="flex gap-2">
                                <a
                                        class="d-btn d-btn-sm"
                                        th:href="@{/dashboard/sims/{iccid}(iccid=${sim.iccid})}"
                                        th:text="#{action.detail}"
                                ></a>
                                <form method="post" th:action="@{/dashboard/sims/{iccid}/deactivate(iccid=${sim.iccid})}" class="inline">
                                    <button
                                            class="d-btn d-btn-sm d-btn-error"
                                            th:text="#{action.delete}"
                                            type="submit"
                                    ></button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <!-- Empty state when sims list exists but empty -->
                    <tr th:if="${sims != null and sims.content != null and sims.content.isEmpty()}">
                        <td class="text-center" colspan="6" th:text="#{sim.empty}">No sims found</td>
                    </tr>

                    <!-- Demo rows when sims not provided (FE demo) -->
                    <tr th:if="${sims == null}">
                        <td>1</td>
                        <td>0987000001</td>
                        <td th:text="#{sim.provider.viettel}">Viettel</td>
                        <td th:text="#{sim.type.prepaid}">Prepaid</td>
                        <td th:text="#{sim.status.active}">Active</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="d-btn d-btn-sm" th:text="#{action.detail}" type="button"></button>
                                <button class="d-btn d-btn-sm d-btn-error" th:text="#{action.delete}"
                                        type="button"></button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${sims == null}">
                        <td>2</td>
                        <td>0987000002</td>
                        <td th:text="#{sim.provider.mobifone}">Mobifone</td>
                        <td th:text="#{sim.type.postpaid}">Postpaid</td>
                        <td th:text="#{sim.status.inactive}">Inactive</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="d-btn d-btn-sm" th:text="#{action.detail}" type="button"></button>
                                <button class="d-btn d-btn-sm d-btn-error" th:text="#{action.delete}"
                                        type="button"></button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${sims == null}">
                        <td>3</td>
                        <td>0987000003</td>
                        <td th:text="#{sim.provider.vinaphone}">Vinaphone</td>
                        <td th:text="#{sim.type.prepaid}">Prepaid</td>
                        <td th:text="#{sim.status.suspended}">Suspended</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="d-btn d-btn-sm" th:text="#{action.detail}" type="button"></button>
                                <button class="d-btn d-btn-sm d-btn-error" th:text="#{action.delete}"
                                        type="button"></button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${sims == null}">
                        <td>4</td>
                        <td>0987000004</td>
                        <td th:text="#{sim.provider.other}">Other</td>
                        <td th:text="#{sim.type.prepaid}">Prepaid</td>
                        <td th:text="#{sim.status.active}">Active</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="d-btn d-btn-sm" th:text="#{action.detail}" type="button"></button>
                                <button class="d-btn d-btn-sm d-btn-error" th:text="#{action.delete}"
                                        type="button"></button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${sims == null}">
                        <td>5</td>
                        <td>0987000005</td>
                        <td th:text="#{sim.provider.viettel}">Viettel</td>
                        <td th:text="#{sim.type.postpaid}">Postpaid</td>
                        <td th:text="#{sim.status.inactive}">Inactive</td>
                        <td>
                            <div class="flex gap-2">
                                <button class="d-btn d-btn-sm" th:text="#{action.detail}" type="button"></button>
                                <button class="d-btn d-btn-sm d-btn-error" th:text="#{action.delete}"
                                        type="button"></button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="mt-6 flex items-center justify-center gap-4" th:if="${sims != null and !sims.content.isEmpty()}">
                <div class="flex gap-2">
                    <a class="d-btn d-btn-sm d-btn-outline" 
                       th:classappend="${sims.first} ? 'd-btn-disabled' : ''"
                       th:href="@{/dashboard/sims/manage(page=0,size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}" 
                       th:text="#{pagination.first}">First</a>
                    <a class="d-btn d-btn-sm d-btn-outline" 
                       th:classappend="${sims.first} ? 'd-btn-disabled' : ''"
                       th:href="@{/dashboard/sims/manage(page=${sims.number - 1},size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}" 
                       th:text="#{pagination.prev}">Prev</a>
                </div>

                <div class="hidden gap-2 sm:flex">
                    <!-- Show current page and surrounding pages -->
                    <th:block th:if="${totalPages > 0}">
                        <a th:if="${currentPage > 0}" 
                           class="d-btn d-btn-sm d-btn-ghost"
                           th:href="@{/dashboard/sims/manage(page=${currentPage - 1},size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}"
                           th:text="${currentPage}">1</a>
                        <a class="d-btn d-btn-sm d-btn-primary"
                           th:text="${currentPage + 1}">2</a>
                        <a th:if="${currentPage < totalPages - 1}" 
                           class="d-btn d-btn-sm d-btn-ghost"
                           th:href="@{/dashboard/sims/manage(page=${currentPage + 1},size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}"
                           th:text="${currentPage + 2}">3</a>
                    </th:block>
                </div>

                <div class="flex gap-2">
                    <a class="d-btn d-btn-sm d-btn-outline" 
                       th:classappend="${sims.last} ? 'd-btn-disabled' : ''"
                       th:href="@{/dashboard/sims/manage(page=${sims.number + 1},size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}" 
                       th:text="#{pagination.next}">Next</a>
                    <a class="d-btn d-btn-sm d-btn-outline" 
                       th:classappend="${sims.last} ? 'd-btn-disabled' : ''"
                       th:href="@{/dashboard/sims/manage(page=${totalPages - 1},size=${sims.size},nhaMang=${nhaMang},loaiSim=${loaiSim},trangThai=${trangThai})}" 
                       th:text="#{pagination.last}">Last</a>
                </div>
            </div>
        </div>

        <input class="d-tab" name="my_tabs_3" th:attr="aria-label=#{nav.detail}" type="radio"/>
        <div class="d-tab-content bg-base-100 border-base-300 p-6">
            <form class="w-full" method="post" th:action="@{/dashboard/sims}">
                <div class="grid grid-cols-2 gap-4">
                    <!-- Identification -->
                    <fieldset class="d-fieldset col-span-1">
                        <legend class="d-fieldset-legend" th:text="#{sim.section.identification}"></legend>
                        <div class="mt-2 grid grid-cols-2 gap-4">
                            <div class="col-span-2">
                                <label class="d-label" for="iccid" th:text="#{sim.field.iccid}"></label>
                                <input class="d-input d-input-bordered w-full" id="iccid" name="iccid" type="text"/>
                            </div>
                            <div class="col-span-1">
                                <label class="d-label" for="msisdn" th:text="#{sim.field.msisdn}"></label>
                                <input class="d-input d-input-bordered w-full" id="msisdn" name="msisdn" type="text"/>
                            </div>
                            <div class="col-span-1">
                                <label class="d-label" for="provider" th:text="#{sim.provider.label}"></label>
                                <select class="d-select d-select-bordered w-full" id="provider" name="provider">
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:text="#{sim.provider.viettel}" value="viettel"></option>
                                    <option th:text="#{sim.provider.mobifone}" value="mobifone"></option>
                                    <option th:text="#{sim.provider.vinaphone}" value="vinaphone"></option>
                                    <option th:text="#{sim.provider.other}" value="other"></option>
                                </select>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Pricing & classification -->
                    <fieldset class="d-fieldset col-span-1">
                        <legend class="d-fieldset-legend" th:text="#{sim.section.classification}"></legend>
                        <div class="mt-2 grid grid-cols-2 gap-4">
                            <div class="col-span-2">
                                <label class="d-label" for="price" th:text="#{sim.field.price}"></label>
                                <input class="d-input d-input-bordered w-full" id="price" name="price" step="0.01"
                                       type="number"/>
                            </div>
                            <div class="col-span-1">
                                <label class="d-label" for="type" th:text="#{sim.type.label}"></label>
                                <select class="d-select d-select-bordered w-full" id="type" name="type">
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:text="#{sim.type.prepaid}" value="prepaid"></option>
                                    <option th:text="#{sim.type.postpaid}" value="postpaid"></option>
                                </select>
                            </div>
                            <div class="col-span-1">
                                <label class="d-label" for="status" th:text="#{sim.status.label}"></label>
                                <select class="d-select d-select-bordered w-full" id="status" name="status">
                                    <option th:text="#{sim.filter.all}" value=""></option>
                                    <option th:text="#{sim.status.active}" value="active"></option>
                                    <option th:text="#{sim.status.inactive}" value="inactive"></option>
                                    <option th:text="#{sim.status.suspended}" value="suspended"></option>
                                </select>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Timestamps -->
                    <fieldset class="d-fieldset md:col-span-2">
                        <legend class="d-fieldset-legend" th:text="#{sim.section.timestamps}"></legend>
                        <div class="mt-2 grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div>
                                <label class="d-label" for="createdAt" th:text="#{sim.field.createdAt}"></label>
                                <input
                                        class="d-input d-input-bordered w-full"
                                        id="createdAt"
                                        name="createdAt"
                                        type="datetime-local"
                                />
                            </div>
                            <div>
                                <label class="d-label" for="updatedAt" th:text="#{sim.field.updatedAt}"></label>
                                <input
                                        class="d-input d-input-bordered w-full"
                                        id="updatedAt"
                                        name="updatedAt"
                                        type="datetime-local"
                                />
                            </div>
                        </div>
                    </fieldset>
                </div>

                <div class="mt-4 flex flex-wrap justify-end gap-2">
                    <!--            <button-->
                    <!--              class="d-btn d-btn-primary"-->
                    <!--              name="action"-->
                    <!--              th:text="#{form.create}"-->
                    <!--              type="submit"-->
                    <!--              value="create"-->
                    <!--            ></button>-->
                    <button class="d-btn d-btn-ghost" th:text="#{form.reset}" type="reset"></button>
                    <button class="d-btn" name="action" th:text="#{form.update}" type="submit" value="update"></button>
                    <button
                            class="d-btn d-btn-error"
                            name="action"
                            th:text="#{form.delete}"
                            type="submit"
                            value="delete"
                    ></button>
                </div>
            </form>
        </div>
    </div>
</main>
</html>

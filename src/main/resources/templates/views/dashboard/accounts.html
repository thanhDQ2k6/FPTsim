<!doctype html>
<html th:replace="~{layouts/dashboard :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title th:text="#{nav.accounts}">Account Management</title>
<main>
    <div class="container mx-auto px-4 py-6">
        <!-- Header with Filter and Create Button -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex-1">
                <h1 class="text-3xl font-bold mb-4">Account Management</h1>
                <fieldset class="d-fieldset max-w-2xl">
                    <legend class="d-fieldset-legend text-lg font-bold" th:text="#{accounts.legend}">Filter Accounts</legend>
                    <form class="flex items-center gap-3" method="get" th:action="@{/dashboard/accounts}">
                        <label class="d-label" for="accountFilter" th:text="#{accounts.select.label}">Role:</label>
                        <select class="d-select d-select-bordered w-full"
                                id="accountFilter"
                                name="role"
                                th:attr="aria-label=#{accounts.select.aria}">
                            <option th:selected="${roleFilter == null or roleFilter == ''}" 
                                    th:text="#{accounts.filter.all}" value="">All</option>
                            <option th:selected="${roleFilter == 'admin'}" 
                                    th:text="#{accounts.filter.admin}" value="admin">Admin</option>
                            <option th:selected="${roleFilter == 'staff'}" 
                                    th:text="#{accounts.filter.staff}" value="staff">Staff</option>
                            <option th:selected="${roleFilter == 'user'}" 
                                    th:text="#{accounts.filter.user}" value="user">User</option>
                        </select>
                        <button class="d-btn d-btn-primary d-btn-sm" type="submit">Apply</button>
                        <a class="d-btn d-btn-ghost d-btn-sm" th:href="@{/dashboard/accounts}" 
                           th:text="#{accounts.reset}">Reset</a>
                    </form>
                </fieldset>
            </div>
            <div>
                <a class="d-btn d-btn-primary" th:href="@{/dashboard/accounts/new}">
                    <i class="fa-solid fa-plus mr-2"></i>
                    <span th:text="#{accounts.create}">Create Account</span>
                </a>
            </div>
        </div>

        <!-- Flash Messages -->
        <div class="d-alert d-alert-success mb-4" th:if="${success}">
            <i class="fa-solid fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div class="d-alert d-alert-error mb-4" th:if="${error}">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Accounts Table -->
        <div class="d-card bg-base-100 shadow-md">
            <div class="d-card-body">
                <div class="overflow-x-auto">
                    <table class="d-table w-full">
                        <thead>
                        <tr>
                            <th class="text-left" th:text="#{accounts.table.no}">No</th>
                            <th class="text-left" th:text="#{accounts.table.fullName}">Full Name</th>
                            <th class="text-left" th:text="#{accounts.table.email}">Email</th>
                            <th class="text-left" th:text="#{accounts.table.phone}">Phone</th>
                            <th class="text-left" th:text="#{accounts.table.role}">Role</th>
                            <th class="text-left" th:text="#{table.action}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="acct, idx : ${accounts}">
                            <td th:text="${idx.index + 1}">1</td>
                            <td th:text="${acct.hoTen}">John Doe</td>
                            <td th:text="${acct.email}">john@example.com</td>
                            <td th:text="${acct.sdt}">0123456789</td>
                            <td>
                                <span class="d-badge d-badge-sm" 
                                      th:classappend="${acct.vaiTro?.name() == 'Admin'} ? 'd-badge-error' : 
                                                     (${acct.vaiTro?.name() == 'NhanVien'} ? 'd-badge-warning' : 'd-badge-info')"
                                      th:text="${acct.vaiTro}">User</span>
                            </td>
                            <td>
                                <a class="d-btn d-btn-sm d-btn-primary" 
                                   th:href="@{/dashboard/accounts/{email}/edit(email=${acct.email})}">
                                    <i class="fa-solid fa-edit"></i>
                                    <span th:text="#{action.edit}">Edit</span>
                                </a>
                            </td>
                        </tr>

                        <!-- Empty state -->
                        <tr th:if="${accounts != null && #lists.isEmpty(accounts)}">
                            <td class="text-center" colspan="6" th:text="#{accounts.empty}">No accounts found</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="mt-6 flex items-center justify-center gap-4" th:if="${page != null}">
                    <div class="flex gap-2">
                        <a class="d-btn d-btn-sm d-btn-outline" 
                           th:classappend="${page.first} ? ' d-btn-disabled' : ''"
                           th:href="@{/dashboard/accounts(page=0, size=${page.size}, role=${roleFilter})}" 
                           th:text="#{pagination.first}">First</a>
                        <a class="d-btn d-btn-sm d-btn-outline" 
                           th:classappend="${page.first} ? ' d-btn-disabled' : ''"
                           th:href="@{/dashboard/accounts(page=${page.number-1}, size=${page.size}, role=${roleFilter})}" 
                           th:text="#{pagination.prev}">Prev</a>
                    </div>

                    <div class="hidden gap-2 sm:flex">
                        <span class="d-btn d-btn-sm" th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 5</span>
                    </div>

                    <div class="flex gap-2">
                        <a class="d-btn d-btn-sm d-btn-outline" 
                           th:classappend="${page.last} ? ' d-btn-disabled' : ''"
                           th:href="@{/dashboard/accounts(page=${page.number+1}, size=${page.size}, role=${roleFilter})}" 
                           th:text="#{pagination.next}">Next</a>
                        <a class="d-btn d-btn-sm d-btn-outline" 
                           th:classappend="${page.last} ? ' d-btn-disabled' : ''"
                           th:href="@{/dashboard/accounts(page=${page.totalPages-1}, size=${page.size}, role=${roleFilter})}" 
                           th:text="#{pagination.last}">Last</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</html>

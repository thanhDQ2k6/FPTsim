<!doctype html>
<html th:replace="~{layouts/layout :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title th:text="#{cart}"></title>
<main>
    <div class="container px-9 py-6">
        <h1 class="mb-3 ml-3 text-3xl font-bold" th:text="#{cart}"></h1>
        <div class="rounded-box bg-base-100 border-base-300 overflow-x-auto border shadow-lg">
            <table class="d-table">
                <!-- head -->
                <thead>
                <tr>
                    <th>
                        <label>
                            <input class="d-checkbox" type="checkbox"/>
                        </label>
                    </th>
                    <th>Name</th>
                    <th>Job</th>
                    <th>Favorite Color</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="item,iter : ${cartItems}">
                    <tr>
                        <th>
                            <label>
                                <input class="d-checkbox" th:checked="${item.selected} ? 'checked' : null"
                                       type="checkbox"/>
                            </label>
                        </th>
                        <td>
                            <div class="flex items-center gap-3">
                                <div>
                                    <div class="font-bold" th:text="${item.name}">Hart Hagerty</div>
                                    <div class="text-sm opacity-50" th:text="${item.country}">United States</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span th:text="${item.company}">Zemlak, Daniel and Leannon</span>
                            <br/>
                            <span class="d-badge d-badge-ghost d-badge-sm" th:text="${item.role}"
                            >Desktop Support Technician</span
                            >
                        </td>
                        <td th:text="${item.color}">Purple</td>
                        <th>
                            <!-- remove button: submit the row index to the cart controller -->
                            <form method="post" style="display: inline" th:action="@{/cart/remove}">
                                <input
                                        th:if="${_csrf != null}"
                                        th:name="${_csrf.parameterName}"
                                        th:value="${_csrf.token}"
                                        type="hidden"
                                />
                                <input name="index" th:value="${iter.index}" type="hidden"/>
                                <button class="d-btn d-btn-error d-btn-xs" type="submit">Remove</button>
                            </form>
                        </th>
                    </tr>
                </th:block>
                </tbody>

                <!-- foot -->
                <tfoot>
                <tr>
                    <th></th>
                    <th>Name</th>
                    <th>Job</th>
                    <th>Favorite Color</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>
</html>

<!doctype html>
<html th:replace="~{layouts/layout :: view(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<title>Home</title>
<main>
    <div class="py-20">
        <div class="container mx-auto px-6 md:px-12">
            <div class="flex flex-col items-center md:flex-row">
                <div class="md:w-1/2 lg:w-2/3">
                    <h1 class="mb-6 text-4xl font-bold">
                        <label th:text="#{welcomeMessage}"></label>
                        <br class="hidden md:block"/>
                        <span class="text-success">FPT</span>sim
                    </h1>
                    <p class="mb-8 text-lg md:text-xl lg:text-2xl" th:text="#{heroDescription}"></p>
                    <div class="flex gap-6">
                        <a class="d-btn d-btn-primary d-btn-xl px-6 py-3 font-bold" th:href="@{/signin}"
                           th:text="#{signIn}"></a>
                        <a
                                class="d-btn d-btn-secondary d-btn-xl px-6 py-3 font-bold"
                                th:href="@{/signup}"
                                th:text="#{signUp}"
                        ></a>
                    </div>
                </div>
                <div class="mt-8 md:mt-0 md:w-1/2 lg:w-1/3">
                    <img alt="Hero Image" class="rounded-lg shadow-lg" src="https://via.placeholder.com/500x500"/>
                </div>
            </div>
        </div>
    </div>
</main>
</html>

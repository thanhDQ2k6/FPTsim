<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" data-theme="retro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - FPTsim</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen auth-bg flex items-center justify-center p-4">
    <div class="w-full max-w-5xl">
        <!-- Flash Messages -->
        <div th:if="${error}" class="d-alert d-alert-error mb-4 shadow-lg">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="d-alert d-alert-success mb-4 shadow-lg">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>

        <!-- Main Card -->
        <div class="d-card bg-base-100 shadow-2xl">
            <div class="d-card-body p-0">
                <div class="grid md:grid-cols-2 gap-0">
                    <!-- Left Side - Welcome -->
                    <div class="hidden md:flex flex-col justify-center items-center p-12 bg-gradient-to-br from-primary to-secondary text-primary-content">
                        <div class="text-center">
                            <i class="fas fa-sim-card text-6xl mb-6"></i>
                            <h2 class="text-4xl font-bold mb-4">Chào mừng trở lại!</h2>
                            <p class="text-lg opacity-90">Đăng nhập để quản lý sim của bạn</p>
                        </div>
                    </div>

                    <!-- Right Side - Login Form -->
                    <div class="p-8 md:p-12">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-base-content">Đăng nhập</h1>
                            <p class="text-base-content/60 mt-2">Nhập thông tin để truy cập hệ thống</p>
                        </div>

                        <form th:action="@{/signin}" method="post" class="space-y-4">
                            <!-- Email -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-envelope mr-2"></i>Email
                                    </span>
                                </label>
                                <input type="email" 
                                       name="email" 
                                       placeholder="your@email.com" 
                                       class="d-input d-input-bordered w-full" 
                                       required 
                                       autofocus />
                            </div>

                            <!-- Password -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-lock mr-2"></i>Mật khẩu
                                    </span>
                                </label>
                                <input type="password" 
                                       name="password" 
                                       placeholder="••••••••" 
                                       class="d-input d-input-bordered w-full" 
                                       required />
                            </div>

                            <!-- Remember & Forgot -->
                            <div class="flex items-center justify-between">
                                <label class="d-label cursor-pointer">
                                    <input type="checkbox" name="remember" class="d-checkbox d-checkbox-sm d-checkbox-primary" />
                                    <span class="d-label-text ml-2">Ghi nhớ đăng nhập</span>
                                </label>
                                <a href="#" class="d-link d-link-primary text-sm">Quên mật khẩu?</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="d-btn d-btn-primary w-full">
                                <i class="fas fa-sign-in-alt mr-2"></i>
                                Đăng nhập
                            </button>

                            <!-- Sign Up Link -->
                            <div class="text-center mt-6">
                                <span class="text-base-content/60">Chưa có tài khoản? </span>
                                <a th:href="@{/signup}" class="d-link d-link-primary font-medium">Đăng ký ngay</a>
                            </div>

                            <!-- Back to Home -->
                            <div class="text-center mt-4">
                                <a th:href="@{/}" class="d-link d-link-hover text-sm">
                                    <i class="fas fa-arrow-left mr-2"></i>Quay về trang chủ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white/80 text-sm">
            <p>&copy; 2025 FPTsim. Powered by FPT University</p>
        </div>
    </div>

    <script>
        // Theme initialization
        const theme = localStorage.getItem('theme') || 'retro';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>
</html>

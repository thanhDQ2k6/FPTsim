<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" data-theme="retro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - FPTsim</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen auth-bg flex items-center justify-center p-4">
    <div class="w-full max-w-5xl">
        <!-- Flash Messages -->
        <div th:if="${error}" class="d-alert d-alert-error mb-4 shadow-lg">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>
        
        <div th:if="${success}" class="d-alert d-alert-success mb-4 shadow-lg">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}"></span>
        </div>

        <!-- Main Card -->
        <div class="d-card bg-base-100 shadow-2xl">
            <div class="d-card-body p-0">
                <div class="grid md:grid-cols-2 gap-0">
                    <!-- Left Side - Welcome -->
                    <div class="hidden md:flex flex-col justify-center items-center p-12 bg-gradient-to-br from-secondary to-accent text-secondary-content">
                        <div class="text-center">
                            <i class="fas fa-user-plus text-6xl mb-6"></i>
                            <h2 class="text-4xl font-bold mb-4">Tham gia ngay!</h2>
                            <p class="text-lg opacity-90">Tạo tài khoản để khám phá sim số đẹp</p>
                        </div>
                    </div>

                    <!-- Right Side - Sign Up Form -->
                    <div class="p-8 md:p-12">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-bold text-base-content">Đăng ký tài khoản</h1>
                            <p class="text-base-content/60 mt-2">Điền thông tin để tạo tài khoản mới</p>
                        </div>

                        <form th:action="@{/signup}" method="post" class="space-y-4">
                            <!-- Full Name -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-user mr-2"></i>Họ và tên *
                                    </span>
                                </label>
                                <input type="text" 
                                       name="hoTen" 
                                       placeholder="Nguyễn Văn A" 
                                       class="d-input d-input-bordered w-full" 
                                       required 
                                       autofocus />
                            </div>

                            <!-- Email -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-envelope mr-2"></i>Email *
                                    </span>
                                </label>
                                <input type="email" 
                                       name="email" 
                                       placeholder="your@email.com" 
                                       class="d-input d-input-bordered w-full" 
                                       required />
                            </div>

                            <!-- Phone -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-phone mr-2"></i>Số điện thoại
                                    </span>
                                </label>
                                <input type="tel" 
                                       name="sdt" 
                                       placeholder="0123456789" 
                                       class="d-input d-input-bordered w-full" 
                                       pattern="[0-9]{10}" />
                            </div>

                            <!-- Address -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-map-marker-alt mr-2"></i>Địa chỉ
                                    </span>
                                </label>
                                <input type="text" 
                                       name="diaChi" 
                                       placeholder="Số nhà, đường, quận, thành phố" 
                                       class="d-input d-input-bordered w-full" />
                            </div>

                            <!-- Password -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-lock mr-2"></i>Mật khẩu *
                                    </span>
                                </label>
                                <input type="password" 
                                       name="matKhau" 
                                       placeholder="••••••••" 
                                       class="d-input d-input-bordered w-full" 
                                       minlength="6"
                                       required />
                            </div>

                            <!-- Confirm Password -->
                            <div class="d-form-control">
                                <label class="d-label">
                                    <span class="d-label-text font-medium">
                                        <i class="fas fa-lock mr-2"></i>Xác nhận mật khẩu *
                                    </span>
                                </label>
                                <input type="password" 
                                       name="confirmPassword" 
                                       placeholder="••••••••" 
                                       class="d-input d-input-bordered w-full" 
                                       minlength="6"
                                       required />
                            </div>

                            <!-- Hidden Role Field (defaults to KhachHang for public registration) -->
                            <input type="hidden" name="vaiTro" value="KhachHang" />

                            <!-- Terms -->
                            <div class="d-form-control">
                                <label class="d-label cursor-pointer justify-start gap-2">
                                    <input type="checkbox" class="d-checkbox d-checkbox-sm d-checkbox-primary" required />
                                    <span class="d-label-text">
                                        Tôi đồng ý với 
                                        <a href="#" class="d-link d-link-primary">Điều khoản dịch vụ</a> 
                                        và 
                                        <a href="#" class="d-link d-link-primary">Chính sách bảo mật</a>
                                    </span>
                                </label>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="d-btn d-btn-primary w-full">
                                <i class="fas fa-user-plus mr-2"></i>
                                Đăng ký
                            </button>

                            <!-- Sign In Link -->
                            <div class="text-center mt-6">
                                <span class="text-base-content/60">Đã có tài khoản? </span>
                                <a th:href="@{/signin}" class="d-link d-link-primary font-medium">Đăng nhập ngay</a>
                            </div>

                            <!-- Back to Home -->
                            <div class="text-center mt-4">
                                <a th:href="@{/}" class="d-link d-link-hover text-sm">
                                    <i class="fas fa-arrow-left mr-2"></i>Quay về trang chủ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white/80 text-sm">
            <p>&copy; 2025 FPTsim. Powered by FPT University</p>
        </div>
    </div>

    <script>
        // Theme initialization
        const theme = localStorage.getItem('theme') || 'retro';
        document.documentElement.setAttribute('data-theme', theme);
        
        // Password confirmation validation
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            const password = document.querySelector('input[name="matKhau"]').value;
            const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Mật khẩu xác nhận không khớp!');
                return false;
            }
        });
    </script>
</body>
</html>

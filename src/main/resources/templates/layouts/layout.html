<!doctype html>
<html lang="en" th:fragment="view(title, content)" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
    <link href="/styles/tailwind.css" rel="stylesheet" type="text/css" />
    <link
      crossorigin="anonymous"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      referrerpolicy="no-referrer"
      rel="stylesheet"
    />
    <link href="/images/logo.svg" rel="icon" />
    <title th:replace="${title}">FPTsim</title>
    <script>
      // Theme initialization - retro by default
      const theme = localStorage.getItem('theme') || 'retro'
      document.documentElement.setAttribute('data-theme', theme)
    </script>
  </head>

  <body>
    <nav class="d-navbar bg-base-100 sticky top-0 z-50 shadow-sm">
      <div class="d-navbar-start">
        <a th:href="@{/}" class="d-btn d-btn-ghost inline-flex items-center gap-0 text-xl font-bold">
          <i class="fa-solid fa-sim-card"></i>
          <span>FPTsim</span>
        </a>
      </div>

      <div class="d-navbar-center">
      </div>

      <div class="d-navbar-end inline-flex items-center gap-4">
          <div class="d-dropdown d-dropdown-left">
              <button class="d-btn d-btn-outline d-btn-xs"><span id="langLabel"></span></button>
              <ul class="d-dropdown-content d-menu bg-base-300 rounded-box p-3 shadow-sm" id="langMenu">
                  <li><a data-lang="vi" href="javascript:void(0);">VI</a></li>
                  <li><a data-lang="en" href="javascript:void(0);">EN</a></li>
              </ul>
          </div>
          <label class="d-toggle text-base-content" th:attr="aria-label=#{theme.toggle}">
              <input class="d-theme-controller" type="checkbox" value="synthwave"/>
              <svg aria-label="sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                      <circle cx="12" cy="12" r="4"></circle>
                      <path d="M12 2v2"></path>
                      <path d="M12 20v2"></path>
                      <path d="m4.93 4.93 1.41 1.41"></path>
                      <path d="m17.66 17.66 1.41 1.41"></path>
                      <path d="M2 12h2"></path>
                      <path d="M20 12h2"></path>
                      <path d="m6.34 17.66-1.41 1.41"></path>
                      <path d="m19.07 4.93-1.41 1.41"></path>
                  </g>
              </svg>
              <svg aria-label="moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                  </g>
              </svg>
          </label>
        <!-- Cart Button - Only navigate to cart page -->
        <a th:href="@{/cart}" 
           class="d-btn d-btn-circle d-btn-ghost"
           th:classappend="${!isLoggedIn} ? ' d-btn-disabled' : ''"
           th:if="${!isLoggedIn}"
           aria-label="cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
        <a th:href="@{/cart}" 
           class="d-btn d-btn-circle d-btn-ghost"
           th:if="${isLoggedIn}"
           aria-label="cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
        
        <!-- User Profile Dropdown -->
        <div class="d-dropdown d-dropdown-end ">
          <button aria-label="profile" class="d-btn d-btn-circle inline-flex items-center" type="button">
            <i class="fa-solid fa-user"></i>
          </button>
          <ul class="d-menu d-dropdown-content bg-base-200 rounded-box mt-2 p-2 shadow min-w-30">
            <li th:if="${isLoggedIn}"><a th:href="@{/profile}" th:text="#{menuUser.profile}"></a></li>
            <li th:if="${isLoggedIn}"><a th:href="@{/orders}" th:text="#{menuUser.orders}">My Orders</a></li>
            <li th:if="${isLoggedIn}"><a th:href="@{/feedback}" th:text="#{menuUser.feedback}">Feedback</a></li>
            <li th:if="${isLoggedIn}"><a th:href="@{/logout}" th:text="#{signOut}"></a></li>

            <li th:unless="${isLoggedIn}"><a th:href="@{/signin}" th:text="#{signIn}"></a></li>
            <li th:unless="${isLoggedIn}"><a th:href="@{/signup}" th:text="#{signUp}"></a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mx-auto h-screen w-full p-3" th:include="${content}"></main>
    <script src="/scripts/langSelector.js"></script>
    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById('themeToggle')
      const currentTheme = localStorage.getItem('theme') || 'retro'

      // Set initial state
      themeToggle.checked = currentTheme === 'synthwave'
      document.documentElement.setAttribute('data-theme', currentTheme)

      themeToggle.addEventListener('change', function () {
        const newTheme = this.checked ? 'synthwave' : 'retro'
        document.documentElement.setAttribute('data-theme', newTheme)
        localStorage.setItem('theme', newTheme)
      })
    </script>
  </body>
</html>
